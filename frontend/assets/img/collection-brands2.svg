<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F2F5"/>
      <stop offset="100%" stop-color="#E0E4EA"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#203A85"/>
      <stop offset="100%" stop-color="#0B2C96"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.12"/></filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <ellipse cx="400" cy="380" rx="420" ry="360" fill="url(#glow)"/>

  <!-- Brand boxes - premium packaging -->
  <g filter="url(#shadow)" transform="translate(300,280)">
    <rect x="-100" y="-80" width="200" height="160" rx="8" fill="#fff" stroke="#E0E4EA" stroke-width="2"/>
    <rect x="-90" y="-70" width="180" height="140" rx="4" fill="#FAFAFA"/>
    <!-- Brand label -->
    <rect x="-60" y="-40" width="120" height="80" rx="4" fill="url(#navy)"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#fff" font-weight="600">BSC</text>
    <text x="0" y="15" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#B9C6EB" letter-spacing="3">EXCLUSIVE</text>
    <!-- Ribbon -->
    <path d="M-100,0 L-120,-15 L-100,-30" fill="#D4AF37" opacity="0.6"/>
    <path d="M100,0 L120,-15 L100,-30" fill="#D4AF37" opacity="0.6"/>
  </g>

  <!-- Stacked boxes -->
  <g filter="url(#shadow)" transform="translate(500,350)">
    <rect x="-70" y="-40" width="140" height="100" rx="6" fill="#fff" stroke="#E0E4EA" stroke-width="2"/>
    <rect x="-65" y="-35" width="130" height="90" rx="3" fill="#FAFAFA"/>
    <rect x="-45" y="-20" width="90" height="50" rx="3" fill="#CA2125" opacity="0.9"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#fff" font-weight="600">BSC</text>
  </g>

  <!-- Fabric swatches -->
  <g filter="url(#shadow)" transform="translate(200,550)">
    <rect x="-50" y="-40" width="100" height="80" rx="4" fill="#D4AF37" transform="rotate(-5)"/>
    <rect x="-45" y="-35" width="90" height="70" rx="3" fill="#F5D060" transform="rotate(-5)"/>
    <rect x="-40" y="-30" width="80" height="60" rx="2" fill="#D4AF37" transform="rotate(-5)" opacity="0.5"/>
  </g>

  <!-- Tags -->
  <g transform="translate(450,550)">
    <rect x="-30" y="-40" width="60" height="80" rx="4" fill="#fff" stroke="#E0E4EA" stroke-width="1.5"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#203A85" font-weight="600">BSC</text>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="6" fill="#8B90A3" letter-spacing="1">PREMIUM</text>
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#E0E4EA" stroke-width="1"/>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="5" fill="#8B90A3">CERTIFIED</text>
  </g>

  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#203A85" opacity="0.3" letter-spacing="8">CURATED BRANDS</text>
</svg>

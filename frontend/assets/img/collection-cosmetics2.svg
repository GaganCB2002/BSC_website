<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F8"/>
      <stop offset="100%" stop-color="#F8E0E8"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A0B0"/>
      <stop offset="50%" stop-color="#D48090"/>
      <stop offset="100%" stop-color="#C06070"/>
    </linearGradient>
    <linearGradient id="compact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D0E0"/>
      <stop offset="100%" stop-color="#E8B0C0"/>
    </linearGradient>
    <linearGradient id="lipstick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.12"/></filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <ellipse cx="400" cy="400" rx="420" ry="360" fill="url(#glow)"/>

  <!-- Perfume bottle -->
  <g filter="url(#shadow)" transform="translate(250,300)">
    <rect x="-30" y="0" width="60" height="120" rx="8" fill="url(#bottle)" opacity="0.9"/>
    <rect x="-15" y="-30" width="30" height="35" rx="4" fill="#D48090"/>
    <rect x="-8" y="-50" width="16" height="25" rx="3" fill="#C06070"/>
    <rect x="-20" y="10" width="40" height="6" rx="2" fill="#F5D0E0" opacity="0.5"/>
    <!-- Label -->
    <rect x="-18" y="40" width="36" height="20" rx="2" fill="#fff" opacity="0.4"/>
  </g>

  <!-- Compact powder -->
  <g filter="url(#shadow)" transform="translate(400,350)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="url(#compact)"/>
    <ellipse cx="0" cy="-15" rx="60" ry="20" fill="#F5D0E0"/>
    <ellipse cx="0" cy="-15" rx="50" ry="15" fill="#E8C0D0"/>
    <ellipse cx="0" cy="-15" rx="40" ry="10" fill="#F5E0E8"/>
    <!-- Mirror -->
    <ellipse cx="0" cy="-30" rx="55" ry="18" fill="#F8F0F4" stroke="#E8B0C0" stroke-width="2"/>
  </g>

  <!-- Lipstick -->
  <g filter="url(#shadow)" transform="translate(550,320)">
    <rect x="-12" y="0" width="24" height="80" rx="4" fill="#2A2A2A"/>
    <rect x="-10" y="-5" width="20" height="10" rx="2" fill="#3A3A3A"/>
    <path d="M-10,-5 L-10,-40 Q0,-50 10,-40 L10,-5 Z" fill="url(#lipstick)"/>
    <rect x="-8" y="-20" width="16" height="3" rx="1" fill="#fff" opacity="0.3"/>
  </g>

  <!-- Nail polish -->
  <g filter="url(#shadow)" transform="translate(320,550)">
    <rect x="-15" y="0" width="30" height="50" rx="6" fill="url(#lipstick)" opacity="0.9"/>
    <rect x="-10" y="-20" width="20" height="25" rx="3" fill="#2A2A2A"/>
    <rect x="-5" y="-30" width="10" height="15" rx="2" fill="#3A3A3A"/>
  </g>

  <!-- Eyeshadow palette -->
  <g filter="url(#shadow)" transform="translate(480,520)">
    <rect x="-70" y="-10" width="140" height="80" rx="8" fill="#2A2A2A"/>
    <rect x="-60" y="0" width="25" height="25" rx="3" fill="#C41E3A"/>
    <rect x="-30" y="0" width="25" height="25" rx="3" fill="#D4AF37"/>
    <rect x="0" y="0" width="25" height="25" rx="3" fill="#8B0000"/>
    <rect x="30" y="0" width="25" height="25" rx="3" fill="#E8B0C0"/>
    <rect x="-60" y="32" width="25" height="25" rx="3" fill="#203A85"/>
    <rect x="-30" y="32" width="25" height="25" rx="3" fill="#4A0E15"/>
    <rect x="0" y="32" width="25" height="25" rx="3" fill="#D48090"/>
    <rect x="30" y="32" width="25" height="25" rx="3" fill="#0A1628"/>
  </g>

  <!-- Brush -->
  <g filter="url(#shadow)" transform="translate(180,480) rotate(-20)">
    <rect x="-5" y="0" width="10" height="100" rx="3" fill="#D4AF37"/>
    <ellipse cx="0" cy="-10" rx="18" ry="25" fill="#2A2A2A"/>
    <ellipse cx="0" cy="-10" rx="14" ry="20" fill="#3A3A3A"/>
  </g>

  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C06070" opacity="0.3" letter-spacing="8">COSMETICS</text>
</svg>

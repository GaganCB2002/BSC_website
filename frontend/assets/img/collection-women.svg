<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6F0"/>
      <stop offset="100%" stop-color="#F5E6D8"/>
    </linearGradient>
    <linearGradient id="silk1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="30%" stop-color="#A01830"/>
      <stop offset="60%" stop-color="#8B1428"/>
      <stop offset="100%" stop-color="#6B0F1E"/>
    </linearGradient>
    <linearGradient id="silk2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C5A028"/>
      <stop offset="100%" stop-color="#B8960F"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D060"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow1"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="40" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1067" fill="url(#bg)"/>

  <!-- Spotlight effect -->
  <ellipse cx="400" cy="350" rx="500" ry="400" fill="url(#spotlight)"/>

  <!-- Main saree drape - flowing silk -->
  <g filter="url(#shadow1)">
    <!-- Saree body -->
    <path d="M200,150 Q250,120 350,140 Q450,160 500,130 Q550,100 600,140 L620,800 Q580,850 500,860 Q400,870 300,850 Q220,830 180,780 Z" fill="url(#silk1)"/>

    <!-- Silk folds -->
    <path d="M250,200 Q320,180 380,200 Q440,220 500,190" stroke="#D4AF37" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M240,280 Q330,260 400,280 Q470,300 530,270" stroke="#D4AF37" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M230,360 Q320,340 410,360 Q490,380 550,350" stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Gold border - elaborate -->
    <path d="M600,140 L620,800" stroke="url(#goldBorder)" stroke-width="12" fill="none"/>
    <path d="M180,780 Q220,830 300,850 Q400,870 500,860 Q580,850 620,800" stroke="url(#goldBorder)" stroke-width="14" fill="none"/>

    <!-- Gold border pattern -->
    <g opacity="0.7">
      <circle cx="610" cy="200" r="4" fill="#F5D060"/>
      <circle cx="612" cy="240" r="3" fill="#D4AF37"/>
      <circle cx="614" cy="280" r="4" fill="#F5D060"/>
      <circle cx="616" cy="320" r="3" fill="#D4AF37"/>
      <circle cx="618" cy="360" r="4" fill="#F5D060"/>
      <circle cx="619" cy="400" r="3" fill="#D4AF37"/>
      <circle cx="620" cy="440" r="4" fill="#F5D060"/>
      <circle cx="620" cy="480" r="3" fill="#D4AF37"/>
      <circle cx="620" cy="520" r="4" fill="#F5D060"/>
      <circle cx="619" cy="560" r="3" fill="#D4AF37"/>
      <circle cx="618" cy="600" r="4" fill="#F5D060"/>
      <circle cx="616" cy="640" r="3" fill="#D4AF37"/>
      <circle cx="614" cy="680" r="4" fill="#F5D060"/>
      <circle cx="612" cy="720" r="3" fill="#D4AF37"/>
      <circle cx="610" cy="760" r="4" fill="#F5D060"/>
    </g>
  </g>

  <!-- Blouse piece -->
  <g filter="url(#shadow1)">
    <path d="M300,160 Q350,140 420,155 Q490,170 540,150 L560,500 Q520,530 450,540 Q380,550 320,530 Q280,510 260,470 Z" fill="#8B1428" opacity="0.9"/>
    <path d="M320,200 Q380,185 440,200 Q500,215 540,200" stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- Accessories -->
  <g transform="translate(550,700)" filter="url(#shadow1)">
    <!-- Bangles -->
    <ellipse cx="0" cy="0" rx="45" ry="40" fill="none" stroke="#D4AF37" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="38" ry="33" fill="none" stroke="#C41E3A" stroke-width="4"/>
    <ellipse cx="15" cy="10" rx="45" ry="40" fill="none" stroke="#D4AF37" stroke-width="6"/>
    <ellipse cx="15" cy="10" rx="38" ry="33" fill="none" stroke="#8B1428" stroke-width="4"/>
  </g>

  <!-- Earring -->
  <g transform="translate(160,680)" filter="url(#shadow1)">
    <circle cx="0" cy="0" r="18" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="12" fill="#C41E3A"/>
    <circle cx="0" cy="0" r="5" fill="#F5D060"/>
    <path d="M0,18 L-8,40 L0,36 L8,40 Z" fill="#D4AF37"/>
  </g>

  <!-- Fabric texture lines -->
  <g opacity="0.08">
    <line x1="200" y1="150" x2="180" y2="780" stroke="#000" stroke-width="0.5"/>
    <line x1="250" y1="160" x2="230" y2="800" stroke="#000" stroke-width="0.5"/>
    <line x1="300" y1="155" x2="280" y2="810" stroke="#000" stroke-width="0.5"/>
    <line x1="350" y1="145" x2="330" y2="820" stroke="#000" stroke-width="0.5"/>
    <line x1="400" y1="150" x2="380" y2="830" stroke="#000" stroke-width="0.5"/>
    <line x1="450" y1="160" x2="430" y2="840" stroke="#000" stroke-width="0.5"/>
    <line x1="500" y1="150" x2="480" y2="835" stroke="#000" stroke-width="0.5"/>
    <line x1="550" y1="140" x2="530" y2="825" stroke="#000" stroke-width="0.5"/>
    <line x1="600" y1="140" x2="580" y2="815" stroke="#000" stroke-width="0.5"/>
  </g>

  <!-- Watermark -->
  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C41E3A" opacity="0.3" letter-spacing="8">KANJIVARAM SILK</text>
</svg>

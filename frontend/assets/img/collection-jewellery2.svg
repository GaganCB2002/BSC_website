<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9F0"/>
      <stop offset="100%" stop-color="#F5E8D0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="30%" stop-color="#F5D060"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8960F"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#5C0000"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="goldGlow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#D4AF37" flood-opacity="0.35"/></filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <ellipse cx="400" cy="380" rx="420" ry="360" fill="url(#glow)"/>

  <!-- Necklace - main -->
  <g filter="url(#goldGlow)">
    <path d="M250,280 Q320,350 400,380 Q480,350 550,280" stroke="url(#gold)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Beads -->
    <circle cx="270" cy="295" r="8" fill="#D4AF37"/>
    <circle cx="300" cy="320" r="7" fill="#F5D060"/>
    <circle cx="330" cy="342" r="8" fill="#D4AF37"/>
    <circle cx="360" cy="358" r="7" fill="#F5D060"/>
    <circle cx="390" cy="370" r="9" fill="#D4AF37"/>
    <circle cx="400" cy="375" r="12" fill="url(#gem)"/>
    <circle cx="400" cy="375" r="5" fill="#F5D060"/>
    <circle cx="410" cy="370" r="9" fill="#D4AF37"/>
    <circle cx="440" cy="358" r="7" fill="#F5D060"/>
    <circle cx="470" cy="342" r="8" fill="#D4AF37"/>
    <circle cx="500" cy="320" r="7" fill="#F5D060"/>
    <circle cx="530" cy="295" r="8" fill="#D4AF37"/>
    <!-- Pendant -->
    <path d="M390,385 L400,430 L410,385" fill="url(#gold)"/>
    <circle cx="400" cy="425" r="15" fill="url(#gem)"/>
    <circle cx="400" cy="425" r="8" fill="#D4AF37"/>
    <circle cx="400" cy="425" r="4" fill="#F5D060"/>
  </g>

  <!-- Earrings -->
  <g filter="url(#goldGlow)" transform="translate(300,420)">
    <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
    <path d="M-8,10 L0,35 L8,10" fill="url(#gold)"/>
    <circle cx="0" cy="30" r="8" fill="url(#gem)"/>
    <circle cx="0" cy="30" r="4" fill="#F5D060"/>
  </g>
  <g filter="url(#goldGlow)" transform="translate(500,420)">
    <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
    <path d="M-8,10 L0,35 L8,10" fill="url(#gold)"/>
    <circle cx="0" cy="30" r="8" fill="url(#gem)"/>
    <circle cx="0" cy="30" r="4" fill="#F5D060"/>
  </g>

  <!-- Bangles -->
  <g filter="url(#goldGlow)" transform="translate(200,550)">
    <ellipse cx="0" cy="0" rx="45" ry="40" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <ellipse cx="0" cy="0" rx="36" ry="31" fill="none" stroke="#8B0000" stroke-width="5"/>
    <ellipse cx="20" cy="8" rx="45" ry="40" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <ellipse cx="20" cy="8" rx="36" ry="31" fill="none" stroke="#D4AF37" stroke-width="5"/>
  </g>

  <!-- Ring -->
  <g filter="url(#goldGlow)" transform="translate(550,550)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="0" cy="-30" r="14" fill="url(#gem)"/>
    <circle cx="0" cy="-30" r="7" fill="#F5D060"/>
    <circle cx="0" cy="-30" r="3" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Tikka -->
  <g filter="url(#goldGlow)" transform="translate(400,200)">
    <circle cx="0" cy="0" r="15" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="10" fill="url(#gem)"/>
    <circle cx="0" cy="0" r="4" fill="#F5D060"/>
    <path d="M0,-15 L0,-40" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="-42" r="5" fill="url(#gold)"/>
  </g>

  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#D4AF37" opacity="0.3" letter-spacing="8">IMITATION JEWELLERY</text>
</svg>

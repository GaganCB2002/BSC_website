<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F2EE"/>
      <stop offset="100%" stop-color="#E8E2DA"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2820"/>
      <stop offset="50%" stop-color="#2A1C15"/>
      <stop offset="100%" stop-color="#1A100A"/>
    </linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#6B5535"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.15"/></filter>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <ellipse cx="400" cy="400" rx="420" ry="360" fill="url(#glow)"/>

  <!-- Formal shoe - left -->
  <g filter="url(#shadow)" transform="translate(250,350)">
    <!-- Sole -->
    <path d="M-80,40 Q-90,50 -80,60 L80,60 Q90,50 80,40 L70,35 Q0,30 -70,35 Z" fill="url(#sole)"/>
    <!-- Upper -->
    <path d="M-70,35 Q-80,0 -60,-30 Q-40,-50 0,-55 Q40,-50 60,-30 Q80,0 70,35 Z" fill="url(#leather)"/>
    <!-- Toe cap -->
    <path d="M-50,-20 Q0,-30 50,-20 Q60,-10 50,0 Q0,10 -50,0 Q-60,-10 -50,-20 Z" fill="#2A1C15" opacity="0.5"/>
    <!-- Lace holes -->
    <circle cx="-15" cy="-15" r="2" fill="#1A100A"/>
    <circle cx="15" cy="-15" r="2" fill="#1A100A"/>
    <circle cx="-15" cy="-25" r="2" fill="#1A100A"/>
    <circle cx="15" cy="-25" r="2" fill="#1A100A"/>
    <circle cx="-15" cy="-35" r="2" fill="#1A100A"/>
    <circle cx="15" cy="-35" r="2" fill="#1A100A"/>
    <!-- Laces -->
    <path d="M-15,-15 L15,-15 M-15,-25 L15,-25 M-15,-35 L15,-35" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
    <!-- Heel -->
    <path d="M-60,35 L-65,60 L-50,60 L-45,35" fill="#1A100A"/>
  </g>

  <!-- Formal shoe - right (angled) -->
  <g filter="url(#shadow)" transform="translate(520,400) rotate(-15)">
    <path d="M-70,35 Q-80,0 -60,-30 Q-40,-50 0,-55 Q40,-50 60,-30 Q80,0 70,35 Z" fill="url(#leather)"/>
    <path d="M-80,40 Q-90,50 -80,60 L80,60 Q90,50 80,40 L70,35 Q0,30 -70,35 Z" fill="url(#sole)"/>
    <path d="M-50,-20 Q0,-30 50,-20 Q60,-10 50,0 Q0,10 -50,0 Q-60,-10 -50,-20 Z" fill="#2A1C15" opacity="0.5"/>
    <circle cx="-15" cy="-25" r="2" fill="#1A100A"/>
    <circle cx="15" cy="-25" r="2" fill="#1A100A"/>
    <circle cx="-15" cy="-35" r="2" fill="#1A100A"/>
    <circle cx="15" cy="-35" r="2" fill="#1A100A"/>
    <path d="M-15,-25 L15,-25 M-15,-35 L15,-35" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
    <path d="M-60,35 L-65,60 L-50,60 L-45,35" fill="#1A100A"/>
  </g>

  <!-- Sandal -->
  <g filter="url(#shadow)" transform="translate(400,600)">
    <path d="M-60,20 Q-70,30 -60,40 L60,40 Q70,30 60,20 L50,15 Q0,10 -50,15 Z" fill="#C4A882"/>
    <path d="M-40,15 Q0,0 40,15" stroke="#8B7355" stroke-width="4" fill="none"/>
    <path d="M-30,15 L0,-20 L30,15" stroke="#8B7355" stroke-width="3" fill="none"/>
  </g>

  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#3A2820" opacity="0.3" letter-spacing="8">FOOTWEAR</text>
</svg>

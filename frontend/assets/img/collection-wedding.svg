<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#F5E0E2"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E1D26"/>
      <stop offset="50%" stop-color="#6B1520"/>
      <stop offset="100%" stop-color="#4A0E15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D060"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="goldGlow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.3"/></filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <ellipse cx="400" cy="380" rx="420" ry="360" fill="url(#glow)"/>

  <!-- Bridal saree - main drape -->
  <g filter="url(#shadow)">
    <path d="M250,180 Q320,150 400,160 Q480,150 550,180 L580,850 Q520,900 400,910 Q280,900 220,850 Z" fill="url(#red)"/>
    <!-- Heavy gold border -->
    <path d="M550,180 L580,850" stroke="url(#gold)" stroke-width="18" fill="none"/>
    <path d="M220,850 Q280,900 400,910 Q520,900 580,850" stroke="url(#gold)" stroke-width="20" fill="none"/>
    <!-- Border pattern -->
    <g opacity="0.6">
      <path d="M555,200 L575,200" stroke="#F5D060" stroke-width="3"/>
      <path d="M557,230 L577,230" stroke="#D4AF37" stroke-width="2"/>
      <path d="M559,260 L579,260" stroke="#F5D060" stroke-width="3"/>
      <path d="M561,290 L581,290" stroke="#D4AF37" stroke-width="2"/>
      <path d="M563,320 L583,320" stroke="#F5D060" stroke-width="3"/>
      <path d="M565,350 L585,350" stroke="#D4AF37" stroke-width="2"/>
      <path d="M567,380 L587,380" stroke="#F5D060" stroke-width="3"/>
      <path d="M569,410 L589,410" stroke="#D4AF37" stroke-width="2"/>
      <path d="M571,440 L591,440" stroke="#F5D060" stroke-width="3"/>
      <path d="M573,470 L593,470" stroke="#D4AF37" stroke-width="2"/>
      <path d="M575,500 L595,500" stroke="#F5D060" stroke-width="3"/>
      <path d="M577,530 L597,530" stroke="#D4AF37" stroke-width="2"/>
      <path d="M579,560 L599,560" stroke="#F5D060" stroke-width="3"/>
      <path d="M580,590 L600,590" stroke="#D4AF37" stroke-width="2"/>
      <path d="M580,620 L600,620" stroke="#F5D060" stroke-width="3"/>
      <path d="M580,650 L600,650" stroke="#D4AF37" stroke-width="2"/>
      <path d="M580,680 L600,680" stroke="#F5D060" stroke-width="3"/>
      <path d="M580,710 L600,710" stroke="#D4AF37" stroke-width="2"/>
      <path d="M580,740 L600,740" stroke="#F5D060" stroke-width="3"/>
      <path d="M580,770 L600,770" stroke="#D4AF37" stroke-width="2"/>
      <path d="M580,800 L600,800" stroke="#F5D060" stroke-width="3"/>
      <path d="M580,830 L600,830" stroke="#D4AF37" stroke-width="2"/>
    </g>
    <!-- Silk texture -->
    <path d="M300,250 Q400,240 500,250" stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M290,350 Q400,340 510,350" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.25"/>
    <path d="M280,450 Q400,440 520,450" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.2"/>
    <path d="M270,550 Q400,540 530,550" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.18"/>
  </g>

  <!-- Bridal jewelry - necklace -->
  <g filter="url(#goldGlow)">
    <path d="M320,200 Q360,230 400,240 Q440,230 480,200" stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="340" cy="218" r="6" fill="#D4AF37"/>
    <circle cx="370" cy="232" r="5" fill="#F5D060"/>
    <circle cx="400" cy="238" r="8" fill="#D4AF37"/>
    <circle cx="430" cy="232" r="5" fill="#F5D060"/>
    <circle cx="460" cy="218" r="6" fill="#D4AF37"/>
    <!-- Pendant -->
    <path d="M395,248 L400,275 L405,248" fill="#D4AF37"/>
    <circle cx="400" cy="270" r="8" fill="#8E1D26" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="400" cy="270" r="3" fill="#F5D060"/>
  </g>

  <!-- Maang tikka -->
  <g filter="url(#goldGlow)">
    <circle cx="400" cy="160" r="12" fill="#D4AF37"/>
    <circle cx="400" cy="160" r="7" fill="#8E1D26"/>
    <circle cx="400" cy="160" r="3" fill="#F5D060"/>
    <path d="M400,148 L400,130" stroke="#D4AF37" stroke-width="2"/>
  </g>

  <!-- Earrings -->
  <g transform="translate(320,190)">
    <circle cx="0" cy="0" r="8" fill="#D4AF37"/>
    <path d="M-6,8 L0,25 L6,8" fill="#D4AF37"/>
    <circle cx="0" cy="22" r="4" fill="#F5D060"/>
  </g>
  <g transform="translate(480,190)">
    <circle cx="0" cy="0" r="8" fill="#D4AF37"/>
    <path d="M-6,8 L0,25 L6,8" fill="#D4AF37"/>
    <circle cx="0" cy="22" r="4" fill="#F5D060"/>
  </g>

  <!-- Bangles -->
  <g transform="translate(240,400)">
    <ellipse cx="0" cy="0" rx="30" ry="25" fill="none" stroke="#D4AF37" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="24" ry="19" fill="none" stroke="#8E1D26" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="18" ry="13" fill="none" stroke="#D4AF37" stroke-width="4"/>
  </g>

  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8E1D26" opacity="0.3" letter-spacing="8">BRIDAL SILK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EDE8E0"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#6B3510"/>
      <stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D060"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.12"/></filter>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <ellipse cx="400" cy="400" rx="420" ry="360" fill="url(#glow)"/>

  <!-- Handbag -->
  <g filter="url(#shadow)" transform="translate(300,350)">
    <rect x="-80" y="-20" width="160" height="120" rx="10" fill="url(#bag)"/>
    <rect x="-70" y="-10" width="140" height="100" rx="6" fill="#6B3510" opacity="0.5"/>
    <!-- Clasp -->
    <rect x="-12" y="-25" width="24" height="15" rx="3" fill="#D4AF37"/>
    <circle cx="0" cy="-17" r="4" fill="#F5D060"/>
    <!-- Handle -->
    <path d="M-40,-20 Q-40,-60 0,-65 Q40,-60 40,-20" stroke="#4A2508" stroke-width="6" fill="none"/>
    <!-- Stitching -->
    <path d="M-65,-5 L65,-5" stroke="#D4AF37" stroke-width="1" fill="none" stroke-dasharray="4,4" opacity="0.4"/>
  </g>

  <!-- Belt -->
  <g filter="url(#shadow)" transform="translate(450,300) rotate(-10)">
    <rect x="-100" y="-8" width="200" height="16" rx="4" fill="#2A1C15"/>
    <rect x="-100" y="-5" width="200" height="10" rx="3" fill="#3A2820"/>
    <!-- Buckle -->
    <rect x="80" y="-12" width="24" height="24" rx="4" fill="#D4AF37"/>
    <rect x="86" y="-6" width="12" height="12" rx="2" fill="#F5D060"/>
    <!-- Holes -->
    <circle cx="-60" cy="0" r="2" fill="#1A100A"/>
    <circle cx="-40" cy="0" r="2" fill="#1A100A"/>
    <circle cx="-20" cy="0" r="2" fill="#1A100A"/>
    <circle cx="0" cy="0" r="2" fill="#1A100A"/>
    <circle cx="20" cy="0" r="2" fill="#1A100A"/>
  </g>

  <!-- Dupatta -->
  <g filter="url(#shadow)" transform="translate(200,550)">
    <path d="M0,0 Q80,-30 160,0 Q200,20 180,80 Q140,120 60,100 Q-20,80 0,0 Z" fill="url(#silk)" opacity="0.8"/>
    <path d="M20,20 Q80,5 140,20" stroke="#B8960F" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M15,40 Q80,25 145,40" stroke="#B8960F" stroke-width="1" fill="none" opacity="0.3"/>
  </g>

  <!-- Clutch -->
  <g filter="url(#shadow)" transform="translate(500,550)">
    <rect x="-60" y="-25" width="120" height="50" rx="6" fill="#2A1C15"/>
    <rect x="-55" y="-20" width="110" height="40" rx="4" fill="#3A2820"/>
    <rect x="-10" y="-30" width="20" height="10" rx="3" fill="#D4AF37"/>
  </g>

  <!-- Sunglasses -->
  <g filter="url(#shadow)" transform="translate(400,200)">
    <path d="M-60,0 Q-50,-20 -30,-20 Q-10,-20 -10,0 Q-10,15 -30,18 Q-50,15 -60,0 Z" fill="#1A100A"/>
    <path d="M10,0 Q20,-20 40,-20 Q60,-20 60,0 Q60,15 40,18 Q20,15 10,0 Z" fill="#1A100A"/>
    <path d="M-10,0 L10,0" stroke="#1A100A" stroke-width="3"/>
    <path d="M-60,0 L-80,-5" stroke="#1A100A" stroke-width="3"/>
    <path d="M60,0 L80,-5" stroke="#1A100A" stroke-width="3"/>
    <!-- Lens reflection -->
    <ellipse cx="-35" cy="-5" rx="10" ry="6" fill="#fff" opacity="0.15"/>
    <ellipse cx="35" cy="-5" rx="10" ry="6" fill="#fff" opacity="0.15"/>
  </g>

  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6B3510" opacity="0.3" letter-spacing="8">FASHION ACCESSORIES</text>
</svg>

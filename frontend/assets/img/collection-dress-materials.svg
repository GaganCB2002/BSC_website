<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F2"/>
      <stop offset="100%" stop-color="#F0E8DA"/>
    </linearGradient>
    <linearGradient id="fabric1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D5B8"/>
      <stop offset="100%" stop-color="#D4C4A8"/>
    </linearGradient>
    <linearGradient id="fabric2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B8A0"/>
      <stop offset="100%" stop-color="#B0A088"/>
    </linearGradient>
    <linearGradient id="fabric3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A89880"/>
      <stop offset="100%" stop-color="#907860"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.12"/></filter>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <ellipse cx="400" cy="400" rx="400" ry="350" fill="url(#glow)"/>

  <!-- Fabric roll 1 -->
  <g filter="url(#shadow)" transform="translate(200,200)">
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="url(#fabric1)"/>
    <rect x="0" y="-60" width="400" height="120" rx="0" fill="url(#fabric1)"/>
    <ellipse cx="400" cy="0" rx="60" ry="60" fill="url(#fabric2)"/>
    <!-- Texture lines -->
    <line x1="20" y1="-50" x2="380" y2="-50" stroke="#C8B8A0" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="-30" x2="380" y2="-30" stroke="#C8B8A0" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="-10" x2="380" y2="-10" stroke="#C8B8A0" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="10" x2="380" y2="10" stroke="#C8B8A0" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="30" x2="380" y2="30" stroke="#C8B8A0" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="50" x2="380" y2="50" stroke="#C8B8A0" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Fabric roll 2 - draped -->
  <g filter="url(#shadow)" transform="translate(150,450)">
    <path d="M0,0 Q100,-40 200,0 Q300,40 400,0 L420,80 Q320,120 220,80 Q120,120 20,80 Z" fill="url(#fabric2)"/>
    <path d="M30,20 Q130,-10 230,20 Q330,50 400,20" stroke="#B0A088" stroke-width="1" fill="none" opacity="0.3"/>
  </g>

  <!-- Fabric roll 3 -->
  <g filter="url(#shadow)" transform="translate(300,600)">
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#fabric3)"/>
    <rect x="0" y="-50" width="350" height="100" fill="url(#fabric3)"/>
    <ellipse cx="350" cy="0" rx="50" ry="50" fill="#A89880"/>
  </g>

  <!-- Loose fabric piece -->
  <g filter="url(#shadow)" transform="translate(100,350)">
    <path d="M0,0 Q80,-30 160,0 Q200,20 180,80 Q140,120 60,100 Q-20,80 0,0 Z" fill="url(#fabric1)" opacity="0.9"/>
  </g>

  <text x="400" y="1020" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8B7355" opacity="0.3" letter-spacing="8">DRESS MATERIALS</text>
</svg>
